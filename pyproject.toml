[project]
name = "rag-ai"
version = "0.3.0"
description = "Grounded PDF question answering with local retrieval and OpenRouter generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10,<4",
    "chromadb>=1.5,<2",
    "fastapi>=0.115,<1",
    "langchain-core>=1.0,<2",
    "numpy>=2.0,<3",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "python-json-logger>=2.0,<3",
    "requests>=2.32,<3",
    "sentence-transformers>=5.0,<6",
    "slowapi>=0.1,<1",
    "starlette-prometheus>=0.10,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pip-audit>=2.7,<3",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<7",
    "ruff>=0.4,<1",
]
ocr = [
    "pillow>=11.0,<13",
    "pymupdf>=1.25,<2",
    "pytesseract>=0.3.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:starlette",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = [
    "S101",   # assert statements in tests are fine
    "S603",   # subprocess without shell — reviewed per use
    "T201",   # print() allowed in CLI entry points
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.pyrefly]
search_path = ["."]
ignore-missing-imports = ["fitz", "fitz.*", "pytesseract", "pytesseract.*", "PIL", "PIL.*"]
