[project]
name = "rag-ai"
version = "0.2.0"
description = "Grounded PDF question answering with local retrieval and OpenRouter generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5,<2",
    "langchain-core>=1.0,<2",
    "numpy>=2.0,<3",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sentence-transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]
ocr = [
    "pillow>=11.0,<13",
    "pymupdf>=1.25,<2",
    "pytesseract>=0.3.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
